name: "Platten-Werkzeug"
version: "0.7.1"
slug: "platten_tool"
description: "Festplatten: formatieren (nur nach Bestätigung), 1:1 kopieren, nächtlicher Abgleich WD → 5 TB (Fotos, Privat)"
url: "https://github.com/Pitbull19850119/Local-Toya-search-tool"
arch: [amd64, aarch64]
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8120
panel_icon: mdi:harddisk
panel_title: "Platten"
udev: true
devices:
  - /dev/fuse
  - /dev/sdb
  - /dev/sdb1
  - /dev/sdb2
  - /dev/sdc
  - /dev/sdc1
  - /dev/sdc2
  - /dev/sdd
  - /dev/sdd1
  - /dev/sdd2
privileged: [SYS_ADMIN, SYS_RAWIO, DAC_READ_SEARCH]
apparmor: false
map:
  - all_addon_configs:rw
  - backup:ro
homeassistant_api: true
ports:
  445/tcp: 445
ports_description:
  445/tcp: "SMB-Freigabe der 5-TB-Platte (nur Heimnetz)"
options:
  sync_aktiv: false
  sync_uhrzeit: 5
  wd_share: "//192.168.0.41/Public"
  wd_ordner: "Fotos"
  wd_user: ""
  wd_password: ""
  ziel_name: "Medien"
  ziel_ordner: "Fotos"
  sync_ordner:
    - "Fotos"
    - "Privat"
  geloescht_tage: 30
  notify_service: "mobile_app_iphone"
  smb_aktiv: false
  smb_user: "mike"
  smb_password: ""
schema:
  sync_aktiv: bool
  sync_uhrzeit: "int(0,23)"
  wd_share: str
  wd_ordner: str
  wd_user: str
  wd_password: password
  ziel_name: str
  ziel_ordner: str
  sync_ordner:
    - str
  geloescht_tage: "int(1,365)"
  notify_service: str
  smb_aktiv: bool
  smb_user: str
  smb_password: password
